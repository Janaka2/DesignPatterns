apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-observability-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command-observability-demo
  template:
    metadata:
      labels:
        app: command-observability-demo
    spec:
      containers:
        - name: app
          image: ghcr.io/janaka2/designpatterns-command-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: command-observability-demo
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
---
apiVersion: v1
kind: Service
metadata:
  name: command-observability-demo
spec:
  selector:
    app: command-observability-demo
  ports:
    - port: 80
      targetPort: 8080
