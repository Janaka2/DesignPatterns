apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-fault-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resilience-fault-demo
  template:
    metadata:
      labels:
        app: resilience-fault-demo
    spec:
      containers:
        - name: app
          image: ghcr.io/janaka2/designpatterns-resilience-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: UPSTREAM_BASE_URL
              value: http://wiremock:8080
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiremock
  template:
    metadata:
      labels:
        app: wiremock
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.13.1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wiremock
spec:
  selector:
    app: wiremock
  ports:
    - port: 8080
      targetPort: 8080
